plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "top.niunaijun.blackboxa"
        minSdkVersion 21
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "2.1.0"

        flavorDimensions "BlackBox32"
    }

    productFlavors {
        // Declared first on purpose: Android Studio selects the first flavor of a
        // dimension as the default variant, and this device/module set is 64-bit
        // (the host apk is blackboxa64). Keeping BlackBox32 first made the IDE
        // install a 32-bit apk by default, which cannot host 64-bit guests.
        BlackBox64 {
            dimension "BlackBox32"
            applicationId "top.niunaijun.blackboxa64"
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue "string", "app_name", "BlackBox64"
            manifestPlaceholders = [APP_ICON      : "@mipmap/ic_launcher",
                                    APP_ROUND_ICON: "@mipmap/ic_launcher_round"]
        }

        BlackBox32 {
            dimension "BlackBox32"
            applicationId "top.niunaijun.blackboxa32"
            ndk {
                abiFilters "armeabi-v7a"
            }
            resValue "string", "app_name", "BlackBox32"
            manifestPlaceholders = [APP_ICON      : "@mipmap/ic_launcher",
                                    APP_ROUND_ICON: "@mipmap/ic_launcher_round"]
        }

        BlackBox64Beta {
            dimension "BlackBox32"
            applicationId "top.niunaijun.blackboxa64_beta"
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue "string", "app_name", "BlackBox64 Beta"
            manifestPlaceholders = [APP_ICON      : "@mipmap/ic_launcher_round_beta",
                                    APP_ROUND_ICON: "@mipmap/ic_launcher_round_beta"]
        }

        BlackBox32Beta {
            dimension "BlackBox32"
            applicationId "top.niunaijun.blackboxa32_beta"
            ndk {
                abiFilters "armeabi-v7a"
            }
            resValue "string", "app_name", "BlackBox32 Beta"
            manifestPlaceholders = [APP_ICON      : "@mipmap/ic_launcher_beta",
                                    APP_ROUND_ICON: "@mipmap/ic_launcher_round_beta"]
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':Bcore')

    //android
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.preference:preference-ktx:1.2.1"

    //coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    //viewModel liveData  lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"


    //third

    implementation 'com.tbuonomo:dotsindicator:4.2'
    //viewPager2 指示点
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    //dialog
    implementation 'com.github.nukc:StateView:2.2.0'
    //状态控制控件
    // 原 jcenter 上的 com.roger.catloadinglibrary / com.imuxuan.floatingview 已随
    // jcenter 下线而消失，改用本地替代实现（见 view/base/CatLoadingDialog 与
    // app/rocker/FloatingViewCompat），避免依赖已死仓库。
    implementation 'com.github.Ferfalk:SimpleSearchView:0.2.0'
    //searchView
    implementation 'com.github.Othershe:CornerLabelView:1.0.0'
    //图标角标

    // osmdroid
    implementation 'org.osmdroid:osmdroid-android:6.1.11'
    //adapter
    implementation 'com.gitee.cbfg5210:RVAdapter:0.3.7'
}
