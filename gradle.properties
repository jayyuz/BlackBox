# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# AGP 8 no longer allows non-transitive R classes to leak into libraries by default.
# BlackBox intentionally shares resources between modules, so keep the legacy behaviour.
android.nonTransitiveRClass=false
# AGP 8 warns for missing (default) build features; we only need view binding in :app
android.defaults.buildfeatures.buildconfig=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
